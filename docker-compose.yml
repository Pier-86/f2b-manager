services:
  f2b-web:
    image: slashino/f2b-manager:latest
    build: .
    container_name: f2b-manager-web
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - F2B_JAILS=sshd,synology-dsm,nginx-http-auth,postfix,roundcube,openvpn
      - F2B_JAIL=sshd
      - F2B_API_KEY=${F2B_API_KEY:-}
      - F2B_API_RATE_LIMIT=60
      - F2B_API_RATE_WINDOW=60
    volumes:
      - /var/run/fail2ban:/var/run/fail2ban
      - /var/lib/fail2ban:/var/lib/fail2ban:ro
      - /var/log/fail2ban.log:/var/log/fail2ban.log:ro
      - /var/log/auth.log:/var/log/auth.log:ro
      - /var/log/nginx:/var/log/nginx:ro
      - /var/log/mail.log:/var/log/mail.log:ro
    privileged: false
